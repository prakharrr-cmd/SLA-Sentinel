<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SLA Sentinel — Enterprise Operations Intelligence &amp; Decision Support</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', '"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
            display: ['"Plus Jakarta Sans"', '"Inter"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          colors: {
            brand: {
              DEFAULT: '#145C43',
              dark: '#103D30',
              hover: '#0F4733',
              light: '#DCE9E1',
              navActive: '#E6F0EA',
              subtle: '#F4F7F5'
            },
            surface: {
              bg: '#F4F7F5',
              card: '#FFFFFF',
              muted: '#F4F7F5',
              border: '#E2EAE5',
              hover: '#F8FAF9'
            },
            content: {
              primary: '#172B28',
              secondary: '#667873',
              tertiary: '#8A9B96',
              inverse: '#FFFFFF'
            }
          }
        }
      }
    }
  </script>
  <style>
    .bg-striped { background-image: repeating-linear-gradient(45deg, #E2EAE5, #E2EAE5 4px, #F4F7F5 4px, #F4F7F5 8px); }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D1DCD6; border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: #B3C4BC; }
  </style>
</head>
<body class="bg-[#F4F7F5] text-[#172B28] font-sans antialiased selection:bg-[#DCE9E1] selection:text-[#145C43] min-h-screen">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
