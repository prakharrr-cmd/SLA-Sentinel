  const [selSquad, setSelSquad] = useState('team-a');
  const [scoreMode, setScoreMode] = useState('comparison');

  // Modals state
  const [explainModalTicket, setExplainModalTicket] = useState(null);
  const [transferModalTicket, setTransferModalTicket] = useState(null);
  const [optimizerModalOpen, setOptimizerModalOpen] = useState(false);
  const [optimizerDismissedIds, setOptimizerDismissedIds] = useState([]);

  // Assign New Ticket Modal state
  const [newTicketModalOpen, setNewTicketModalOpen] = useState(false);
  const [newProblem, setNewProblem] = useState('');
  const [newCategory, setNewCategory] = useState('Payments');
  const [newPriority, setNewPriority] = useState('High');
  const [newDeadlineHours, setNewDeadlineHours] = useState(2.0);
  const [newSelectedTeamId, setNewSelectedTeamId] = useState('');

  // CSV Batch Ingestion state
  const [csvModalOpen, setCsvModalOpen] = useState(false);
  const [csvParsedTickets, setCsvParsedTickets] = useState([]);
  const [csvError, setCsvError] = useState('');

  const flash = m => { setToast(m); setTimeout(() => setToast(''), 4000); };

  // KPIs
  const total = tickets.length;
  const highRisk = tickets.filter(t => t.riskLevel === 'High' && t.status !== 'Resolved').length;
  const breached = tickets.filter(t => t.deadlineHoursLeft <= 0 && t.status !== 'Resolved').length;
  const overloaded = teams.filter(t => (t.activeTickets / t.maxCapacity) >= 0.8).length;

  // AI Recommendation Engine for new ticket assignment
  const getRecommendedSquad = (category, teamsList) => {
    const catLower = (category || '').toLowerCase();
    let matchingSquads = teamsList.filter(tm => 
      tm.skills.some(s => s.toLowerCase().includes(catLower) || catLower.includes(s.toLowerCase()))
    );
    if (matchingSquads.length === 0) {
      matchingSquads = [...teamsList];
    }
    // Sort by open slots (desc) and utilization ratio (asc)
    matchingSquads.sort((a, b) => {
      const aSlots = a.maxCapacity - a.activeTickets;
      const bSlots = b.maxCapacity - b.activeTickets;
      if (bSlots !== aSlots) return bSlots - aSlots;
      return (a.activeTickets / a.maxCapacity) - (b.activeTickets / b.maxCapacity);
    });
    const best = matchingSquads[0];
    const hasSkill = best.skills.some(s => s.toLowerCase().includes(catLower) || catLower.includes(s.toLowerCase()));
    return {
      squad: best,
      reason: hasSkill
        ? `'${best.name}' matches '${category}' skills with ${best.maxCapacity - best.activeTickets} open slots (${Math.round(best.activeTickets / best.maxCapacity * 100)}% load). Best candidate to protect SLA.`
        : `'${best.name}' has lowest concurrent workload (${Math.round(best.activeTickets / best.maxCapacity * 100)}% load) with ${best.maxCapacity - best.activeTickets} open slots.`
    };
  };

  // CSV Parser & Squad Recommendation Engine
  const parseCsvText = (text) => {
    setCsvError('');
    if (!text || !text.trim()) {
      setCsvParsedTickets([]);
      return;
    }

    try {
      const lines = text.trim().split(/\r?\n/).filter(line => line.trim().length > 0);
      if (lines.length < 2) {
        setCsvError('CSV must include a header row and at least one ticket data row.');
        setCsvParsedTickets([]);
        return;
      }

      const headers = lines[0].split(',').map(h => h.trim().toLowerCase().replace(/['"]/g, ''));
      const probIdx = headers.findIndex(h => h.includes('prob') || h.includes('issue') || h.includes('title') || h.includes('desc'));
      const catIdx = headers.findIndex(h => h.includes('cat') || h.includes('type'));
      const prioIdx = headers.findIndex(h => h.includes('prio') || h.includes('sev'));
      const deadIdx = headers.findIndex(h => h.includes('dead') || h.includes('hour') || h.includes('sla'));
      const teamIdx = headers.findIndex(h => h.includes('team') || h.includes('squad') || h.includes('assign'));

      if (probIdx === -1) {
        setCsvError("Missing required column 'problem' or 'title' in CSV header.");
        setCsvParsedTickets([]);
        return;
      }

      const splitCsvLine = (line) => {
        const result = [];
        let cur = '';
        let insideQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '"') {
            insideQuotes = !insideQuotes;
          } else if (ch === ',' && !insideQuotes) {
            result.push(cur.trim());
            cur = '';
          } else {
            cur += ch;
          }
        }
        result.push(cur.trim());
        return result;
      };

      const parsedList = [];
      let baseIdNum = 100 + tickets.length + 1;

      for (let i = 1; i < lines.length; i++) {
        const cols = splitCsvLine(lines[i]);
        if (cols.length === 0 || !cols[probIdx]) continue;

        const problem = cols[probIdx].replace(/^["']|["']$/g, '').trim();
        if (!problem) continue;

        let category = catIdx !== -1 && cols[catIdx] ? cols[catIdx].replace(/^["']|["']$/g, '').trim() : 'Payments';
        const catNorm = category.toLowerCase();
        if (catNorm.includes('pay')) category = 'Payments';
        else if (catNorm.includes('bill') || catNorm.includes('refund')) category = 'Billing';
        else if (catNorm.includes('infra') || catNorm.includes('cloud') || catNorm.includes('devops')) category = 'Infrastructure';
        else if (catNorm.includes('auth') || catNorm.includes('login') || catNorm.includes('account')) category = 'Authentication';
        else category = 'Payments';

        let priority = prioIdx !== -1 && cols[prioIdx] ? cols[prioIdx].replace(/^["']|["']$/g, '').trim() : 'High';
        const prioNorm = priority.toLowerCase();
        if (prioNorm.includes('crit') || prioNorm.includes('p0')) priority = 'Critical';
        else if (prioNorm.includes('high') || prioNorm.includes('p1')) priority = 'High';
        else if (prioNorm.includes('med') || prioNorm.includes('p2')) priority = 'Medium';
        else if (prioNorm.includes('low') || prioNorm.includes('p3')) priority = 'Low';
        else priority = 'High';

        let deadlineHours = 2.0;
        if (deadIdx !== -1 && cols[deadIdx]) {
          const parsedHours = parseFloat(cols[deadIdx].replace(/[^0-9.-]/g, ''));
          if (!isNaN(parsedHours)) deadlineHours = parsedHours;
        }

        const rec = getRecommendedSquad(category, teams);
        let chosenTeamId = rec.squad.id;

        if (teamIdx !== -1 && cols[teamIdx]) {
          const teamVal = cols[teamIdx].toLowerCase();
          const matchedTeam = teams.find(t => 
            t.id.toLowerCase() === teamVal || 
            t.name.toLowerCase().includes(teamVal) || 
            (teamVal.includes('a') && t.id === 'team-a') ||
            (teamVal.includes('b') && t.id === 'team-b') ||
            (teamVal.includes('c') && t.id === 'team-c') ||
            (teamVal.includes('d') && t.id === 'team-d')
          );
          if (matchedTeam) chosenTeamId = matchedTeam.id;
        }

        parsedList.push({
          rowId: 'row-' + i,
          ticketId: 'T' + (baseIdNum++),
          problem,
          category,
          priority,
          deadlineHours,
          assignedTeamId: chosenTeamId,
          recommendedTeamId: rec.squad.id,
          recommendationReason: rec.reason
        });
      }

      if (parsedList.length === 0) {
        setCsvError('No valid ticket rows found in CSV. Please verify column formats.');
        setCsvParsedTickets([]);
      } else {
        setCsvParsedTickets(parsedList);
      }
    } catch (err) {
      setCsvError('Failed to parse CSV: ' + err.message);
      setCsvParsedTickets([]);
    }
  };

  const handleCsvFileUpload = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      parseCsvText(event.target.result);
    };
    reader.onerror = () => {
      setCsvError('Failed to read the selected file.');
    };
    reader.readAsText(file);
  };

  const loadSampleCsv = () => {

      'Delayed GST invoice generation for 120 enterprise orders,Billing,High,2.5\n' +
      'Kubelet node pressure spike in US-East cluster,Infrastructure,High,1.5\n' +
      '2FA SMS code delivery failure for Jio & Airtel users,Authentication,Medium,4.0\n' +
      'Chargeback dispute webhook signature mismatch,Payments,High,2.0';
    parseCsvText(sample);

  const downloadCsvTemplate = () => {

    link.click();
    document.body.removeChild(link);

  const handleCommitCsvTickets = () => {
    if (csvParsedTickets.length === 0) return;

    const teamIncrements = {};
    const newCreatedTickets = [];

    csvParsedTickets.forEach(row => {
      teamIncrements[row.assignedTeamId] = (teamIncrements[row.assignedTeamId] || 0) + 1;
      const targetSquad = teams.find(t => t.id === row.assignedTeamId) || teams[0];

      let baseRisk = 30;
      if (row.priority === 'Critical') baseRisk = 75;
      else if (row.priority === 'High') baseRisk = 55;
      else if (row.priority === 'Medium') baseRisk = 35;
      else baseRisk = 15;

      if (row.deadlineHours <= 1.0) baseRisk += 20;
      else if (row.deadlineHours <= 2.0) baseRisk += 10;

      const squadUtil = (targetSquad.activeTickets + (teamIncrements[row.assignedTeamId] || 1)) / targetSquad.maxCapacity;
      if (squadUtil >= 0.8) baseRisk += 15;
      else baseRisk -= 5;

      const finalRisk = Math.min(99, Math.max(15, baseRisk));

      newCreatedTickets.push({
        id: row.ticketId,
        problem: row.problem,
        category: row.category,
        priority: row.priority,
        pendingHours: 0.1,
        deadlineHoursLeft: parseFloat(row.deadlineHours),
        assignedTeamId: row.assignedTeamId,
        status: 'Pending',
        riskScore: finalRisk,
        riskLevel: finalRisk >= 75 ? 'High' : finalRisk >= 40 ? 'Medium' : 'Low',
        weights: { deadlinePressure: 40, squadCongestion: 35, categoryMttrLag: 15 },
        evidence: [
          'Ingested from CSV batch with ' + row.deadlineHours + 'h SLA deadline',
          'Assigned to ' + targetSquad.name + ' based on skills & capacity',
          'Initial heuristic risk score: ' + finalRisk + '/100'
        ],
        suggestedAction: 'Assigned to ' + targetSquad.name,
        actionType: 'Monitor',
        actionTaken: null,
        impactEstimate: 'SLA monitored in live queue'
      });
    });

    setTeams(prevTeams => prevTeams.map(tm => {
      const added = teamIncrements[tm.id] || 0;
      return added > 0 ? { ...tm, activeTickets: tm.activeTickets + added } : tm;
    }));

    setTickets(prev => [...newCreatedTickets, ...prev]);

    const count = newCreatedTickets.length;
    setCsvModalOpen(false);
    setCsvParsedTickets([]);
    flash('âœ“ Successfully ingested ' + count + ' tickets from CSV and assigned to squads!');
  };

  // Create new ticket submission
  const handleCreateTicketSubmit = (e) => {

                            </div>
                            <div className="text-[10px] text-slate-400 mt-0.5">
                              Lead: {tm.lead} • Load: <strong className={isFull ? 'text-rose-600' : 'text-slate-700'}>{tm.activeTickets}/{tm.maxCapacity}</strong> ({Math.round(tm.activeTickets/tm.maxCapacity*100)}%)
                            </div>
                          </div>
                        </div>

                        <div className="flex items-center space-x-2">
                          <input
                            type="radio"
                            name="selectedTeam"
                            checked={isSelected}
                            onChange={() => setNewSelectedTeamId(tm.id)}
                            className="accent-[#1F5C6B] cursor-pointer"
                          />
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              <div className="pt-3 border-t border-slate-100 flex justify-end space-x-2">
                <button
                  type="button"
                  onClick={() => setNewTicketModalOpen(false)}
                  className="px-4 py-2 rounded-xl text-xs text-slate-500 hover:bg-slate-100 cursor-pointer"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="px-5 py-2.5 rounded-xl text-xs font-bold text-white bg-[#1F5C6B] hover:bg-[#174955] shadow-md transition cursor-pointer"
                >
                  Create &amp; Assign Ticket →
                </button>
              </div>
            </form>
          </div>
        </div>
      )}

      {/* ═════════════════════════════════════════════════════════════
          MODAL 2: SQUAD SELECTION FOR TRANSFERS
         ═════════════════════════════════════════════════════════════ */}
      {transferModalTicket && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
          <div className="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-7 shadow-2xl border border-slate-100 text-xs space-y-5 animate-fade-in">
            <div className="flex justify-between items-start pb-3 border-b border-slate-100">
              <div>
                <div className="flex items-center space-x-2">
                  <span className="font-mono font-bold text-xs px-2.5 py-1 rounded-lg bg-[#1F5C6B]/10 text-[#1F5C6B] border border-[#3D7080]/30">
                    {transferModalTicket.id}
                  </span>
                  <span className="text-xs font-semibold text-slate-500">
                    {transferModalTicket.category}
                  </span>
                </div>
                <h3 className="text-base font-bold text-slate-900 mt-2">{transferModalTicket.problem}</h3>
                <p className="text-[11px] text-slate-500 mt-0.5">
                  Currently with: <strong className="text-slate-800">{teams.find(t => t.id === transferModalTicket.assignedTeamId)?.name}</strong>
                </p>
              </div>
              <button
                onClick={() => setTransferModalTicket(null)}
                className="text-slate-400 hover:text-slate-700 text-lg cursor-pointer p-1"
              >
                ✕
              </button>
            </div>

            <div>
              <div className="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2.5">
                Select Destination Squad
              </div>
              <div className="space-y-2.5">
                {teams.map(tm => {
                  const isCurrent = tm.id === transferModalTicket.assignedTeamId;
                  const isFull = tm.activeTickets >= tm.maxCapacity;
                  const hasSkillMatch = tm.skills.some(s => s.toLowerCase().includes(transferModalTicket.category.toLowerCase()) || transferModalTicket.category.toLowerCase().includes(s.toLowerCase()));

                  return (
                    <div
                      key={tm.id}
                      className={`p-3.5 rounded-2xl border flex items-center justify-between transition ${
                        isCurrent
                          ? 'bg-slate-50 border-slate-200 opacity-60'
                          : isFull
                          ? 'bg-rose-50/40 border-rose-200'
                          : 'bg-white hover:bg-emerald-50/30 border-slate-200 hover:border-[#1F5C6B]'
                      }`}
                    >
                      <div className="flex items-center space-x-3">
                        <div className="text-2xl">{tm.avatar}</div>
                        <div>
                          <div className="flex items-center space-x-2">
                            <span className="font-bold text-slate-900 text-xs">{tm.name}</span>
                            {isCurrent && (
                              <span className="text-[9px] font-semibold px-2 py-0.5 rounded-full bg-slate-200 text-slate-700">
                                Current Squad
                              </span>
                            )}
                            {hasSkillMatch && !isCurrent && (
                              <span className="text-[9px] font-semibold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">
                                ✓ Matching Skill
                              </span>
                            )}
                          </div>
                          <div className="text-[11px] text-slate-400 mt-0.5">
                            Lead: {tm.lead} • Load: <strong className={isFull ? 'text-rose-600' : 'text-slate-700'}>{tm.activeTickets}/{tm.maxCapacity}</strong> ({Math.round((tm.activeTickets / tm.maxCapacity) * 100)}%)
                          </div>
                        </div>
                      </div>

                      <div>
                        {isCurrent ? (
                          <span className="text-[11px] text-slate-400 font-medium px-3 py-1.5">Assigned</span>
                        ) : (
                          <button
                            onClick={() => {
                              reassign(transferModalTicket.id, tm.id);
                              setTransferModalTicket(null);
                            }}
                            className={`px-3 py-1.5 rounded-xl text-xs font-bold transition cursor-pointer ${
                              isFull
                                ? 'bg-amber-600 hover:bg-amber-700 text-white'
                                : 'bg-[#1F5C6B] hover:bg-[#174955] text-white shadow-xs'
                            }`}
                          >
                            {isFull ? 'Transfer (Overload)' : 'Transfer Here →'}
                          </button>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="pt-2 flex justify-end border-t border-slate-100">
              <button
                onClick={() => setTransferModalTicket(null)}
                className="px-4 py-2 rounded-xl text-xs text-slate-500 hover:bg-slate-100 cursor-pointer"
              >
                Cancel
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ═════════════════════════════════════════════════════════════
          MODAL 3: AI AUTO-OPTIMIZER SUGGESTION & REVIEW DIALOG
         ═════════════════════════════════════════════════════════════ */}
      {optimizerModalOpen && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
          <div className="bg-white rounded-3xl max-w-2xl w-full p-6 sm:p-7 shadow-2xl border border-slate-100 text-xs space-y-5 animate-fade-in max-h-[90vh] flex flex-col">
            <div className="flex justify-between items-start pb-3 border-b border-slate-100">
              <div>
                <div className="flex items-center space-x-2">
                  <span className="px-2.5 py-1 rounded-lg bg-[#1F5C6B]/10 text-[#1F5C6B] border border-[#3D7080]/30 font-bold text-xs">
                    ⚡ AI Auto-Optimizer
                  </span>
                  <span className="text-[10px] font-semibold text-slate-400">
                    Human-in-the-Loop Review
                  </span>
                </div>
                <h3 className="text-base font-bold text-slate-900 mt-2">Recommended Workload Rebalances</h3>
                <p className="text-[11px] text-slate-500 mt-0.5">
                  The optimization engine has identified the following changes to prevent SLA breaches. Review and decide on each change individually.
                </p>
              </div>
              <button
                onClick={() => setOptimizerModalOpen(false)}
                className="text-slate-400 hover:text-slate-700 text-lg cursor-pointer p-1"
              >
                ✕
              </button>
            </div>

            <div className="overflow-y-auto space-y-3.5 pr-1 flex-1">
              {optimizerSuggestions.length === 0 ? (
                <div className="p-8 text-center bg-slate-50 rounded-2xl border border-slate-100">
                  <div className="text-3xl mb-2">🎉</div>
                  <div className="font-bold text-slate-800 text-sm">All Squads Balanced</div>
                  <p className="text-slate-500 text-xs mt-1">No pending overloaded squads or urgent breach risks detected.</p>
                </div>
              ) : (
                optimizerSuggestions.map(item => {
                  const isApplied = item.applied;
                  const isSkipped = optimizerDismissedIds.includes(item.ticket.id);
                  const sourceSquad = teams.find(t => t.id === item.fromTeamId);
                  const targetSquad = teams.find(t => t.id === item.toTeamId);

                  return (
                    <div
                      key={item.ticket.id}
                      className={`p-4 rounded-2xl border transition ${
                        isApplied
                          ? 'bg-emerald-50/40 border-emerald-200'
                          : isSkipped
                          ? 'bg-slate-50 border-slate-200 opacity-60'
                          : 'bg-white border-slate-200/90 shadow-2xs hover:border-[#1F5C6B]'
                      }`}
                    >
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-2 mb-2 border-b border-slate-100">
                        <div className="flex items-center space-x-2">
                          <span className="font-mono font-bold text-xs px-2 py-0.5 rounded bg-slate-100 text-slate-800">
                            {item.ticket.id}
                          </span>
                          <span className="font-bold text-slate-900 text-xs truncate max-w-xs">
                            {item.ticket.problem}
                          </span>
                        </div>
                        <div className="flex items-center space-x-2 text-[10px]">
                          <span className="font-mono text-rose-600 font-bold">
                            {item.ticket.deadlineHoursLeft > 0 ? `${item.ticket.deadlineHoursLeft}h until breach` : 'Past Due'}
                          </span>
                          <span className="text-slate-400">•</span>
                          <span className="font-semibold text-slate-600">Risk: {item.ticket.riskScore}/100</span>
                        </div>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3 text-[11px]">
                        <div className="p-2.5 rounded-xl bg-slate-50 border border-slate-100">
                          <span className="text-[10px] font-bold text-slate-400 uppercase">From Overloaded Squad</span>
                          <div className="font-bold text-slate-800 mt-0.5">{sourceSquad?.name}</div>
                          <div className="text-[10px] text-rose-600">Current Load: {sourceSquad?.activeTickets}/{sourceSquad?.maxCapacity} tasks</div>
                        </div>
                        <div className="p-2.5 rounded-xl bg-emerald-50/60 border border-emerald-100">
                          <span className="text-[10px] font-bold text-emerald-800 uppercase">To Target Squad</span>
                          <div className="font-bold text-slate-800 mt-0.5">{targetSquad?.name}</div>
                          <div className="text-[10px] text-emerald-700">Available: {targetSquad?.maxCapacity - targetSquad?.activeTickets} open slots</div>
                        </div>
                      </div>

                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pt-1">
                        <span className="text-[11px] text-slate-500">
                          Impact: <strong className="text-slate-700 font-mono">Risk drops {item.ticket.riskScore} → {Math.max(25, item.ticket.riskScore - 35)}</strong>
                        </span>

                        <div className="flex items-center space-x-2">
                          {isApplied ? (
                            <span className="px-3 py-1 rounded-xl bg-emerald-100 text-emerald-800 font-bold text-xs flex items-center space-x-1">
                              <span>✓</span>
                              <span>Approved &amp; Applied</span>
                            </span>
                          ) : isSkipped ? (
                            <div className="flex items-center space-x-2">
                              <span className="text-xs text-slate-400 italic">Skipped</span>
                              <button
                                onClick={() => setOptimizerDismissedIds(prev => prev.filter(id => id !== item.ticket.id))}
                                className="text-xs text-[#1F5C6B] underline font-semibold"
                              >
                                Undo
                              </button>
                            </div>
                          ) : (
                            <>
                              <button
                                onClick={() => setOptimizerDismissedIds(prev => [...prev, item.ticket.id])}
                                className="px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-500 hover:bg-slate-100 border border-slate-200 cursor-pointer"
                              >
                                ✕ Decline
                              </button>
                              <button
                                onClick={() => {
                                  reassign(item.ticket.id, item.toTeamId);
                                }}
                                className="px-4 py-1.5 rounded-xl text-xs font-bold text-white bg-[#1F5C6B] hover:bg-[#174955] cursor-pointer shadow-2xs"
                              >
                                ✓ Approve &amp; Transfer
                              </button>
                            </>
                          )}
                        </div>
                      </div>
                    </div>
                  );
                })
              )}
            </div>

            <div className="pt-3 border-t border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <span className="text-[11px] text-slate-500">
                Pending decision: <strong className="text-slate-800">{optimizerSuggestions.filter(s => !s.applied && !optimizerDismissedIds.includes(s.ticket.id)).length} changes</strong>
              </span>
              <div className="flex space-x-2">
                <button
                  onClick={() => setOptimizerModalOpen(false)}
                  className="px-4 py-2 rounded-xl text-xs text-slate-600 hover:bg-slate-100 cursor-pointer"
                >
                  Close Plan
                </button>
                {optimizerSuggestions.filter(s => !s.applied && !optimizerDismissedIds.includes(s.ticket.id)).length > 0 && (
                  <button
                    onClick={() => {
                      const remaining = optimizerSuggestions.filter(s => !s.applied && !optimizerDismissedIds.includes(s.ticket.id));
                      remaining.forEach(r => reassign(r.ticket.id, r.toTeamId));
                      flash(`⚡ Approved and applied ${remaining.length} suggested reassignments!`);
                    }}
                    className="px-4 py-2 rounded-xl text-xs font-bold text-white bg-[#1F5C6B] hover:bg-[#174955] cursor-pointer shadow-sm"
                  >
                    Approve All Remaining
                  </button>
                )}
              </div>
            </div>
          </div>
        </div>
      )}

      {/* ═════════════════════════════════════════════════════════════
          MODAL 4: INTERACTIVE EXPLAINABLE AI MODAL (PILLAR 4)
         ═════════════════════════════════════════════════════════════ */}
      {explainModalTicket && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
          <div className="bg-white rounded-3xl max-w-xl w-full p-6 sm:p-7 shadow-2xl border border-slate-100 text-xs space-y-5 animate-fade-in">
            <div className="flex justify-between items-start pb-3 border-b border-slate-100">
              <div>
                <div className="flex items-center space-x-2">
                  <span className="font-mono font-bold text-xs px-2.5 py-1 rounded-lg bg-slate-100 text-slate-900">
                    {explainModalTicket.id}
                  </span>
                  <span className="text-xs font-semibold text-slate-500">
                    {explainModalTicket.category}
                  </span>
                </div>
                <h3 className="text-base font-bold text-slate-900 mt-2">{explainModalTicket.problem}</h3>
              </div>
              <button
                onClick={() => setExplainModalTicket(null)}
                className="text-slate-400 hover:text-slate-700 text-lg cursor-pointer p-1"
              >
                ✕
              </button>
            </div>

            {/* Heuristic Formula Attribution */}
            <div>
              <div className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">Feature Importance Breakdown</div>
              <div className="space-y-2 bg-slate-50 p-3.5 rounded-2xl border border-slate-100">
                <div>
                  <div className="flex justify-between text-[11px] mb-1">
                    <span className="text-slate-600">Deadline Urgency Weight:</span>
                    <strong className="text-slate-900 font-mono">45%</strong>
                  </div>
                  <div className="h-1.5 w-full bg-slate-200 rounded-full overflow-hidden">
                    <div className="h-full bg-rose-500 rounded-full" style={{ width: '45%' }} />
                  </div>
                </div>
                <div>
                  <div className="flex justify-between text-[11px] mb-1">
                    <span className="text-slate-600">Squad Capacity Congestion:</span>
                    <strong className="text-slate-900 font-mono">35%</strong>
                  </div>
                  <div className="h-1.5 w-full bg-slate-200 rounded-full overflow-hidden">
                    <div className="h-full bg-amber-500 rounded-full" style={{ width: '35%' }} />
                  </div>
                </div>
                <div>
                  <div className="flex justify-between text-[11px] mb-1">
                    <span className="text-slate-600">Historical Category MTTR Lag:</span>
                    <strong className="text-slate-900 font-mono">20%</strong>
                  </div>
                  <div className="h-1.5 w-full bg-slate-200 rounded-full overflow-hidden">
                    <div className="h-full bg-[#1F5C6B] rounded-full" style={{ width: '20%' }} />
                  </div>
                </div>
              </div>
            </div>

            {/* Evidence Chain */}
            <div>
              <h4 className="text-xs font-bold text-slate-800 uppercase tracking-wider mb-2">Evidence Chain Supporting Prediction</h4>
              <div className="space-y-2 text-xs">
                {(explainModalTicket.evidence || [explainModalTicket.suggestedAction]).map((e, i) => (
                  <div key={i} className="p-3 rounded-xl bg-slate-50 border border-slate-200/80 flex items-start space-x-2 text-slate-700">
                    <span className="font-mono font-bold text-[#1F5C6B]">0{i + 1}.</span>
                    <span>{e}</span>
                  </div>
                ))}
              </div>
            </div>

            {/* Action Bar */}
            <div className="pt-2 flex justify-between items-center border-t border-slate-100">
              <span className="text-[11px] text-slate-500">
                Status: <strong className="text-slate-800">{explainModalTicket.actionTaken || 'Pending Review'}</strong>
              </span>

              <div className="flex space-x-2">
                <button
                  onClick={() => setExplainModalTicket(null)}
                  className="px-4 py-2 rounded-xl text-xs text-slate-500 hover:bg-slate-100 cursor-pointer"
                >
                  Close
                </button>
                {explainModalTicket.actionType === 'Reassign' && !explainModalTicket.actionTaken && (
                  <button
                    onClick={() => {
                      const t = explainModalTicket;
                      setExplainModalTicket(null);
                      setTransferModalTicket(t);
                    }}
                    className="px-4 py-2 rounded-xl text-xs font-bold text-white bg-[#1F5C6B] hover:bg-[#174955] cursor-pointer"
                  >
                    Transfer to Squad →
                  </button>
                )}
                {explainModalTicket.actionType === 'Escalate' && !explainModalTicket.actionTaken && (
                  <button
                    onClick={() => escalate(explainModalTicket.id)}
                    className="px-4 py-2 rounded-xl text-xs font-bold text-white bg-rose-600 hover:bg-rose-700 cursor-pointer"
                  >
                    Escalate to Lead
                  </button>
                )}
              </div>
            </div>

          </div>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
