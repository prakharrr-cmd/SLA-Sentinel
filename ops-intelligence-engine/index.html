function App(){

  const [timerSec,setTimerSec]=useState(5048);
  const [timerOn,setTimerOn]=useState(true);

  useEffect(()=>{if(!timerOn)return;const i=setInterval(()=>setTimerSec(s=>s+1),1000);return()=>clearInterval(i)},[timerOn]);
  const fmt=s=>`${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor(s%3600/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  const flash=m=>{setToast(m);setTimeout(()=>setToast(''),4000)};

  // KPIs
  const total=tickets.length;
  const highRisk=tickets.filter(t=>t.riskLevel==='High'&&t.status!=='Resolved').length;
  const breached=tickets.filter(t=>t.deadlineHoursLeft<=0&&t.status!=='Resolved').length;
  const overloaded=teams.filter(t=>t.activeTickets/t.maxCapacity>=0.8).length;

  // Actions
  const reassign=(tid,target)=>{
    const tk=tickets.find(t=>t.id===tid);if(!tk)return;
    const tm=teams.find(t=>t.id===target);
    setTeams(teams.map(t=>{
      if(t.id===tk.assignedTeamId&&t.activeTickets>0)return{...t,activeTickets:t.activeTickets-1};
      if(t.id===target)return{...t,activeTickets:t.activeTickets+1};return t;
    }));
    setTickets(tickets.map(t=>{
      if(t.id===tid){const ns=Math.max(25,t.riskScore-35);return{...t,assignedTeamId:target,riskScore:ns,riskLevel:ns>=75?'High':ns>=40?'Medium':'Low',actionTaken:`Transferred → ${tm?.name.split('—')[0]||target}`,suggestedAction:'Workload balanced'};}
      return t;
    }));
    flash(`✓ ${tid} transferred to ${tm?.name.split('—')[0]}`);
  };

  const escalate=tid=>{
    setTickets(tickets.map(t=>t.id===tid?{...t,status:'Escalated',actionTaken:'Escalated to Lead'}:t));
    flash(`⚠️ ${tid} escalated to Department Lead`);
  };

  const autoOptimize=()=>{
    setTeams(teams.map(t=>{if(t.id==='team-a')return{...t,activeTickets:5};if(t.id==='team-b')return{...t,activeTickets:8};return t;}));
    setTickets(tickets.map(t=>{
      if(t.assignedTeamId==='team-a'&&t.riskLevel==='High'){const ns=Math.max(25,t.riskScore-40);return{...t,assignedTeamId:'team-b',riskScore:ns,riskLevel:'Low',actionTaken:'Auto-Optimized → Team B',suggestedAction:'Balanced by algorithm'};}
      return t;
    }));
    flash('⚡ Auto-Optimizer executed: 3 tasks rebalanced from Team A → Team B');
  };

  const filtered=tickets.filter(t=>{
    if(!search)return true;const q=search.toLowerCase();
    if(q==='breached')return t.deadlineHoursLeft<=0;
    if(q==='high')return t.riskLevel==='High';
    return t.id.toLowerCase().includes(q)||t.problem.toLowerCase().includes(q)||t.category.toLowerCase().includes(q);
  });

  const actionable=tickets.filter(t=>(t.actionType==='Reassign'||t.actionType==='Escalate')&&!t.actionTaken).slice(0,2);
  const explainTk=tickets.find(t=>t.id===explainId)||tickets[0];

  if(!user)return <LoginPage onLogin={setUser}/>;

  return (
    <div className="bg-white rounded-[28px] md:rounded-[36px] shadow-2xl border border-slate-200/80 flex flex-col md:flex-row gap-6 lg:gap-8 relative overflow-hidden" style={{minHeight:'95vh'}}>

      {/* TOAST */}
      {toast&&<div className="fixed bottom-8 right-8 z-50 px-5 py-3 rounded-2xl bg-slate-900 text-white text-xs font-semibold shadow-2xl flex items-center space-x-2"><span className="text-emerald-400 text-base">✦</span><span>{toast}</span></div>}

      {/* ───── LEFT SIDEBAR ───── */}

        <div className="space-y-6">
          {/* Logo */}
          <div className="flex items-center space-x-3">
            <div className="w-10 h-10 rounded-2xl bg-[#134E39] text-white flex items-center justify-center shadow-sm"><svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9" strokeWidth="2.5"/><circle cx="12" cy="12" r="4" strokeWidth="2.5"/></svg></div>

          </div>

          {/* MENU */}
          <div>
            <div className="text-[11px] font-bold text-slate-400 tracking-wider uppercase px-3 mb-2">Menu</div>
            <nav className="space-y-1">

                {id:'tasks',label:'Tasks & Queue',badge:String(total)},
                {id:'bottlenecks',label:'Surge & Patterns',badge:null},
                {id:'scorecard',label:'Analytics',badge:null},

              ].map(it=>(
                <button key={it.id} onClick={()=>setTab(it.id)} className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-2xl text-xs font-semibold transition cursor-pointer ${tab===it.id?'bg-[#134E39] text-white shadow-sm':'text-slate-600 hover:text-slate-900 hover:bg-slate-100/70'}`}>
                  <span>{it.label}</span>
                  {it.badge&&<span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${tab===it.id?'bg-[#0E3A2B] text-emerald-200':'bg-slate-100 text-slate-600'}`}>{it.badge}</span>}

            </nav>
          </div>
        </div>

        {/* Bottom Promo */}
        <div className="mt-6 bg-[#0E3A2B] bg-waves rounded-3xl p-5 text-white shadow-lg">
          <h4 className="text-xs font-bold">AI Mobile Dispatcher</h4>

          <button onClick={()=>flash('📱 Companion app connected!')} className="mt-3 w-full py-2 rounded-xl bg-[#1B8A5A] hover:bg-emerald-600 text-[11px] font-bold shadow-xs cursor-pointer">Download</button>
        </div>
      </aside>

      {/* ───── MAIN CONTENT ───── */}
      <main className="flex-1 flex flex-col space-y-6 p-5 md:py-7 md:pr-7 md:pl-0 overflow-y-auto">

                {tickets.map(t=>(
                  <button key={t.id} onClick={()=>setExplainId(t.id)} className={`w-full text-left p-3.5 rounded-2xl border transition flex justify-between items-center cursor-pointer ${t.id===explainId?'bg-emerald-50/70 border-[#134E39]':'bg-slate-50/60 border-slate-200 hover:border-slate-300'}`}>
                    <div><div className="font-mono font-bold text-xs text-slate-900">{t.id} • {t.category}</div><div className="text-[11px] text-slate-500 truncate max-w-[170px]">{t.problem}</div></div>
                    <span className={`text-xs font-mono font-bold ${t.riskLevel==='High'?'text-rose-600':'text-slate-600'}`}>{t.riskScore}/100</span>
                  </button>
                ))}
              </div>
              <div className="lg:col-span-2 bg-slate-50 rounded-2xl p-6 border border-slate-200/80 space-y-5">
                <div className="flex justify-between items-start pb-4 border-b border-slate-200">
                  <div><span className="font-mono font-bold text-xs px-2.5 py-1 rounded-lg bg-white border border-slate-200 text-slate-900">{explainTk.id}</span><h3 className="text-sm font-bold text-slate-900 mt-2">{explainTk.problem}</h3></div>
                  <div className="text-right"><div className="text-[10px] uppercase font-bold text-slate-400">AI Recommendation</div><div className="text-xs font-bold text-[#134E39] mt-0.5">{explainTk.suggestedAction}</div></div>
                </div>
                <div><h4 className="text-xs font-bold text-slate-800 uppercase tracking-wider mb-2.5">Evidence Chain</h4>
                  <div className="space-y-2 text-xs">{(explainTk.evidence||[explainTk.suggestedAction]).map((e,i)=>(
                    <div key={i} className="p-3 rounded-xl bg-white border border-slate-200/80 flex items-start space-x-2 text-slate-700"><span className="font-mono font-bold text-[#134E39]">0{i+1}.</span><span>{e}</span></div>
                  ))}</div>
                </div>
                <div className="grid grid-cols-2 gap-4 text-xs">
                  <div className="p-4 rounded-xl bg-white border border-slate-200/80"><div className="text-[10px] font-bold uppercase text-slate-400">Impact Estimate</div><div className="font-bold text-slate-900 mt-1">{explainTk.impactEstimate}</div></div>
                  <div className="p-4 rounded-xl bg-white border border-slate-200/80"><div className="text-[10px] font-bold uppercase text-slate-400">Model Confidence</div><div className="font-bold text-emerald-700 mt-1 font-mono">94% (Random Forest)</div></div>
                </div>
                {explainTk.actionType==='Reassign'&&<div className="pt-2 flex justify-end"><button onClick={()=>reassign(explainTk.id,'team-b')} className="px-5 py-2.5 rounded-xl text-xs font-bold text-white bg-[#134E39] hover:bg-[#0E3A2B] shadow-sm cursor-pointer">Approve Transfer to Team B</button></div>}
                {explainTk.actionType==='Escalate'&&<div className="pt-2 flex justify-end"><button onClick={()=>escalate(explainTk.id)} className="px-5 py-2.5 rounded-xl text-xs font-bold text-white bg-rose-600 hover:bg-rose-700 shadow-sm cursor-pointer">Escalate to Lead</button></div>}
              </div>
            </div>
          </div>
        )}

        {/* ══════ BASELINE VS IMPACT SCORECARD TAB ══════ */}
        {tab==='scorecard'&&(
          <div className="bg-white rounded-3xl p-6 border border-slate-100 shadow-sm space-y-6">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 border-b border-slate-100">
              <div><h2 className="text-lg font-bold text-slate-900">Baseline vs. AI Decision Engine Scorecard</h2><p className="text-xs text-slate-400">Empirical benchmark — SLA adherence, turnaround time, squad burnout (Pillar 5)</p></div>
              <div className="flex items-center space-x-1 p-1 bg-slate-100 rounded-2xl text-xs">
                {['comparison','baseline','proposed'].map(m=>(
                  <button key={m} onClick={()=>setScoreMode(m)} className={`px-3 py-1.5 rounded-xl font-bold cursor-pointer ${scoreMode===m?'bg-white text-slate-900 shadow-xs':'text-slate-500'}`}>{m==='comparison'?'Side-by-Side':m==='baseline'?'Baseline':'AI Engine'}</button>
                ))}
              </div>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
              {[
                {label:'SLA Compliance',bv:SCORECARD.baseline.sla,pv:SCORECARD.proposed.sla,d:SCORECARD.delta.sla,desc:'Tickets resolved within SLA window'},
                {label:'Mean Turnaround',bv:SCORECARD.baseline.tat,pv:SCORECARD.proposed.tat,d:SCORECARD.delta.tat,desc:'Average time to resolve customer issues'},
                {label:'Squad Overload',bv:SCORECARD.baseline.overload,pv:SCORECARD.proposed.overload,d:SCORECARD.delta.overload,desc:'Weekly hours squads operate above 80 % threshold'}
              ].map((m,i)=>(
                <div key={i} className="p-5 rounded-3xl bg-slate-50 border border-slate-200/80 flex flex-col justify-between">
                  <div>
                    <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">{i+1}. {m.label}</span>
                    <div className="flex items-baseline space-x-3 mt-3">
                      {scoreMode!=='proposed'&&<span className={`text-2xl font-bold font-mono ${scoreMode==='comparison'?'line-through text-slate-400':'text-slate-900'}`}>{m.bv}</span>}
                      {scoreMode==='comparison'&&<span className="text-slate-400">→</span>}
                      {scoreMode!=='baseline'&&<span className="text-4xl font-extrabold text-[#134E39] font-mono">{m.pv}</span>}
                    </div>
                    <p className="text-xs text-slate-500 mt-2">{m.desc}</p>
                  </div>
                  <div className="mt-4 pt-3 border-t border-slate-200 font-bold text-[#134E39] text-xs font-mono">{m.d} improvement</div>
                </div>
              ))}
            </div>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
              <div className="p-5 rounded-3xl bg-slate-50 border border-slate-200/80">
                <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">4. Monthly SLA Breaches</span>
                <div className="flex items-baseline space-x-3 mt-3">
                  {scoreMode!=='proposed'&&<span className={`text-2xl font-bold font-mono ${scoreMode==='comparison'?'line-through text-slate-400':'text-slate-900'}`}>{SCORECARD.baseline.breaches}</span>}
                  {scoreMode==='comparison'&&<span className="text-slate-400">→</span>}
                  {scoreMode!=='baseline'&&<span className="text-4xl font-extrabold text-[#134E39] font-mono">{SCORECARD.proposed.breaches}</span>}
                </div>
                <p className="text-xs text-slate-500 mt-2">Total SLA violations per month</p>
                <div className="mt-4 pt-3 border-t border-slate-200 font-bold text-[#134E39] text-xs font-mono">{SCORECARD.delta.breaches} breach reduction</div>
              </div>
              <div className="p-5 rounded-3xl bg-slate-50 border border-slate-200/80">
                <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">5. Productivity Index</span>
                <div className="flex items-baseline space-x-3 mt-3">
                  {scoreMode!=='proposed'&&<span className={`text-2xl font-bold font-mono ${scoreMode==='comparison'?'line-through text-slate-400':'text-slate-900'}`}>{SCORECARD.baseline.productivity}</span>}
                  {scoreMode==='comparison'&&<span className="text-slate-400">→</span>}
                  {scoreMode!=='baseline'&&<span className="text-4xl font-extrabold text-[#134E39] font-mono">{SCORECARD.proposed.productivity}</span>}
                </div>
                <p className="text-xs text-slate-500 mt-2">Composite efficiency score across all squads</p>
                <div className="mt-4 pt-3 border-t border-slate-200 font-bold text-[#134E39] text-xs font-mono">{SCORECARD.delta.productivity} productivity gain</div>
              </div>
            </div>
          </div>
        )}

      </main>

      {/* CSV MODAL */}
      {uploadOpen&&(
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
          <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100 text-xs">
            <div className="flex justify-between items-center mb-3"><h3 className="text-base font-bold text-slate-900">Import Dataset</h3><button onClick={()=>setUploadOpen(false)} className="text-slate-400 hover:text-slate-700 text-lg cursor-pointer">✕</button></div>
            <p className="text-slate-500 mb-3">Paste CSV data or use pre-configured sample data:</p>
            <textarea rows="5" value={csv} onChange={e=>setCsv(e.target.value)} placeholder="ticket_id,problem,category,priority,pending_hours,deadline_hours_left,assigned_team,status" className="w-full font-mono p-3 bg-slate-50 rounded-2xl border border-slate-200 text-slate-800 mb-3 focus:outline-none focus:border-[#134E39]"/>
            <div className="flex justify-between items-center">
              <button onClick={()=>setCsv('T103,Server down,Infrastructure,Critical,1.0,0.5,team-c,Pending\nT104,Refund delay,Billing,High,10.0,-2.0,team-a,Escalated')} className="text-[#134E39] font-bold underline cursor-pointer">Insert Sample</button>
              <div className="flex space-x-2">
                <button onClick={()=>setUploadOpen(false)} className="px-3 py-2 text-slate-500 cursor-pointer">Cancel</button>
                <button onClick={()=>{setUploadOpen(false);flash('✓ Dataset processed successfully')}} className="px-4 py-2 rounded-xl font-bold text-white bg-[#134E39] hover:bg-[#0E3A2B] cursor-pointer">Process</button>
              </div>
            </div>
          </div>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
