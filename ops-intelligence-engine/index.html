            setTimerSeconds(sec => sec + 1);
          }, 1000);
        }
        return () => clearInterval(interval);
      }, [isTimerRunning]);

      const formatTimer = (totalSeconds) => {
        const hrs = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
        const mins = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
        const secs = String(totalSeconds % 60).padStart(2, '0');
        return `${hrs}:${mins}:${secs}`;
      };

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(''), 4000);

      // Metrics
      const totalTickets = tickets.length;
      const highRiskTickets = tickets.filter(t => t.riskLevel === 'High' && t.status !== 'Resolved').length;
      const slaBreached = tickets.filter(t => t.deadlineHoursLeft <= 0 && t.status !== 'Resolved').length;
      const runningTickets = tickets.filter(t => t.status !== 'Resolved').length;
      const overloadedTeams = teams.filter(t => (t.activeTickets / t.maxCapacity) >= 0.8).length;
      const avgPending = (tickets.reduce((sum, t) => sum + t.pendingHours, 0) / (totalTickets || 1)).toFixed(1);

      // Reassign action
      const handleReassign = (ticketId, targetTeamId) => {
        const ticket = tickets.find(t => t.id === ticketId);
        if (!ticket) return;

        const targetTeam = teams.find(tm => tm.id === targetTeamId);

        setTeams(teams.map(tm => {
          if (tm.id === ticket.assignedTeamId && tm.activeTickets > 0) return { ...tm, activeTickets: tm.activeTickets - 1 };
          if (tm.id === targetTeamId) return { ...tm, activeTickets: tm.activeTickets + 1 };
          return tm;
        }));

        setTickets(tickets.map(t => {
          if (t.id === ticketId) {
            const newScore = Math.max(25, t.riskScore - 35);
            return {
              ...t,
              assignedTeamId: targetTeamId,
              riskScore: newScore,
              riskLevel: newScore >= 75 ? 'High' : newScore >= 40 ? 'Medium' : 'Low',
              actionTaken: `Transferred to ${targetTeam?.name.split('-')[0] || targetTeamId}`,
              suggestedAction: 'Workload successfully balanced'
            };
          }
          return t;
        }));

        showToast(`✓ Ticket ${ticketId} reassigned to ${targetTeam?.name.split('-')[0]}`);
      };

      // 1-Click Auto Optimizer (Pillar 3)
      const handleRunAutoOptimizer = () => {
        setTeams(teams.map(tm => {
          if (tm.id === 'team-a') return { ...tm, activeTickets: 5 };
          if (tm.id === 'team-b') return { ...tm, activeTickets: 8 };
          return tm;
        }));

        setTickets(tickets.map(t => {
          if (t.assignedTeamId === 'team-a' && t.riskLevel === 'High') {
            const newScore = Math.max(25, t.riskScore - 40);
            return {
              ...t,
              assignedTeamId: 'team-b',
              riskScore: newScore,
              riskLevel: 'Low',
              actionTaken: 'Auto-Optimized: Transferred to Team B (Payments)',
              suggestedAction: 'Workload successfully balanced by algorithm'
            };
          }
          return t;
        }));

        showToast('⚡ Auto-Optimizer Executed: 3 bottlenecked tasks rebalanced from Team A to Team B!');

        setTickets(tickets.map(t => {
          if (t.id === ticketId) return { ...t, status: 'Escalated', actionTaken: 'Escalated to Lead' };
          return t;
        }));
        showToast(`⚠️ Ticket ${ticketId} escalated to Operations Lead`);

        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        if (q === 'breached') return t.deadlineHoursLeft <= 0;
        if (q === 'high') return t.riskLevel === 'High';
        return t.id.toLowerCase().includes(q) || t.problem.toLowerCase().includes(q) || t.category.toLowerCase().includes(q);
      });

      const actionableRecommendations = tickets.filter(

                  <div>
                    <h2 className="text-lg font-bold text-slate-900">Baseline vs. AI Decision Engine Scorecard</h2>
                    <p className="text-xs text-slate-400">Empirical benchmark comparison on SLA adherence, turnaround time, and squad burnout</p>
                  </div>

                  <div className="flex items-center space-x-1 p-1 bg-slate-100 rounded-2xl text-xs self-start sm:self-auto">
                    <button onClick={() => setScorecardMode('comparison')} className={`px-3 py-1.5 rounded-xl font-bold cursor-pointer ${scorecardMode === 'comparison' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-500'}`}>Side-by-Side</button>
                    <button onClick={() => setScorecardMode('baseline')} className={`px-3 py-1.5 rounded-xl font-bold cursor-pointer ${scorecardMode === 'baseline' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-500'}`}>Baseline</button>
                    <button onClick={() => setScorecardMode('proposed')} className={`px-3 py-1.5 rounded-xl font-bold cursor-pointer ${scorecardMode === 'proposed' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-500'}`}>AI Engine</button>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                  <div className="p-5 rounded-3xl bg-slate-50 border border-slate-200/80 flex flex-col justify-between">
                    <div>
                      <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">1. SLA Compliance</span>
                      <div className="flex items-baseline space-x-3 mt-3">
                        {scorecardMode !== 'proposed' && <span className={`text-2xl font-bold font-mono ${scorecardMode === 'comparison' ? 'line-through text-slate-400' : 'text-slate-900'}`}>{PERFORMANCE_SCORECARD.baseline.slaComplianceRate}</span>}
                        {scorecardMode === 'comparison' && <span className="text-slate-400">→</span>}
                        {scorecardMode !== 'baseline' && <span className="text-4xl font-extrabold text-[#134E39] font-mono">{PERFORMANCE_SCORECARD.proposed.slaComplianceRate}</span>}
                      </div>
                      <p className="text-xs text-slate-500 mt-2">Percentage of incoming issues resolved within SLA limits.</p>
                    </div>
                    <div className="mt-4 pt-3 border-t border-slate-200 font-bold text-[#134E39] text-xs font-mono">{PERFORMANCE_SCORECARD.improvements.slaGain} net SLA improvement</div>
                  </div>

                  <div className="p-5 rounded-3xl bg-slate-50 border border-slate-200/80 flex flex-col justify-between">
                    <div>
                      <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">2. Mean Turnaround Time</span>
                      <div className="flex items-baseline space-x-3 mt-3">
                        {scorecardMode !== 'proposed' && <span className={`text-2xl font-bold font-mono ${scorecardMode === 'comparison' ? 'line-through text-slate-400' : 'text-slate-900'}`}>{PERFORMANCE_SCORECARD.baseline.avgTurnaroundHours}</span>}
                        {scorecardMode === 'comparison' && <span className="text-slate-400">→</span>}
                        {scorecardMode !== 'baseline' && <span className="text-4xl font-extrabold text-[#134E39] font-mono">{PERFORMANCE_SCORECARD.proposed.avgTurnaroundHours}</span>}
                      </div>
                      <p className="text-xs text-slate-500 mt-2">Average turnaround hours to resolve customer issues.</p>
                    </div>
                    <div className="mt-4 pt-3 border-t border-slate-200 font-bold text-[#134E39] text-xs font-mono">{PERFORMANCE_SCORECARD.improvements.timeReduction} turnaround reduction</div>
                  </div>

                  <div className="p-5 rounded-3xl bg-slate-50 border border-slate-200/80 flex flex-col justify-between">
                    <div>
                      <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">3. Squad Overload Duration</span>
                      <div className="flex items-baseline space-x-3 mt-3">
                        {scorecardMode !== 'proposed' && <span className={`text-2xl font-bold font-mono ${scorecardMode === 'comparison' ? 'line-through text-slate-400' : 'text-slate-900'}`}>{PERFORMANCE_SCORECARD.baseline.overloadedSquadHours}</span>}
                        {scorecardMode === 'comparison' && <span className="text-slate-400">→</span>}
                        {scorecardMode !== 'baseline' && <span className="text-4xl font-extrabold text-[#134E39] font-mono">{PERFORMANCE_SCORECARD.proposed.overloadedSquadHours}</span>}
                      </div>
                      <p className="text-xs text-slate-500 mt-2">Weekly hours squads operate at over-capacity threshold.</p>
                    </div>
                    <div className="mt-4 pt-3 border-t border-slate-200 font-bold text-[#134E39] text-xs font-mono">{PERFORMANCE_SCORECARD.improvements.burnoutReduction} burnout reduction</div>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* IMPORT CSV MODAL */}
          {isUploadOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100 text-xs">
                <div className="flex justify-between items-center mb-3">
                  <h3 className="text-base font-bold text-slate-900">Import Operations Dataset</h3>
                  <button onClick={() => setIsUploadOpen(false)} className="text-slate-400 hover:text-slate-700 text-lg cursor-pointer">✕</button>
                </div>
                <p className="text-slate-500 mb-3">Paste CSV data or use pre-configured Devithon sample data:</p>
                <textarea
                  rows="5"
                  value={csvInput}
                  onChange={e => setCsvInput(e.target.value)}
                  placeholder="ticket_id,problem,category,priority,pending_hours,deadline_hours_left,assigned_team,status"
                  className="w-full text-xs font-mono p-3 bg-slate-50 rounded-2xl border border-slate-200 text-slate-800 mb-3 focus:outline-none focus:border-[#134E39]"
                ></textarea>
                <div className="flex justify-between items-center">
                  <button
                    onClick={() => {
                      setCsvInput(`ticket_id,problem,category,priority,pending_hours,deadline_hours_left,assigned_team,status
T103,Production Server down in US-East cluster,Infrastructure,Critical,1.0,0.5,Team C - DevOps,Pending
T104,Refund delay for 45 pending orders,Billing,High,10.0,-2.0,Team A - Payments,Escalated
T101,Payment failure at checkout webhook,Payments,High,5.0,1.0,Team A - Payments,Pending`);
                    }}
                    className="text-xs text-[#134E39] font-bold underline cursor-pointer"
                  >
                    Insert Sample Data
                  </button>
                  <div className="flex space-x-2">
                    <button onClick={() => setIsUploadOpen(false)} className="px-3 py-2 text-xs text-slate-500 cursor-pointer">Cancel</button>
                    <button
                      onClick={() => {
                        setIsUploadOpen(false);
                        showToast('✓ Sample dataset processed successfully');
                      }}
                      className="px-4 py-2 rounded-xl text-xs font-bold text-white bg-[#134E39] hover:bg-[#0E3A2B] transition cursor-pointer"
                    >
                      Process CSV
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
